<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Uploaded Anime | Pique Animes</title><style>
:root{--bg:#08090d;--panel:#12151d;--line:#292e3b;--muted:#9ca3b2;--red:#e11d48;--gold:#e8c27a;--white:#f7f7fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#252b3c 0,transparent 42%),var(--bg);color:var(--white);font:15px Inter,system-ui,Arial,sans-serif}.wrap{width:min(1180px,92%);margin:30px auto 70px}a{color:inherit;text-decoration:none}.brand{font-weight:950;letter-spacing:1.5px}.brand span{color:var(--red)}.back{float:right;color:var(--gold)}.hero{margin-top:24px;padding:28px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,#191f2c,#11141c)}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:850}.hero h1{font-size:clamp(30px,6vw,52px);margin:10px 0}.muted{color:var(--muted);line-height:1.6}.season{margin-top:30px}.season h2{font-size:22px}.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.episode{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;transition:.2s}.episode:hover{border-color:var(--gold);transform:translateY(-3px)}.episode strong{display:block}.episode small{display:block;color:var(--muted);margin-top:8px}.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}@media(max-width:600px){.episodes{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}}
</style><link rel="stylesheet" href="./site-upgrade.css">
</head><body><main class="wrap"><a class="brand" href="index.html">PIQUE <span>ANIMES</span></a><a class="back" href="anime.html">← Anime library</a><section class="hero"><span class="eyebrow">WATCH ON PIQUE ANIMES</span><h1 id="seriesTitle">Loading series…</h1><p class="muted">Choose a season, then select an episode to watch it right here on Pique Animes.</p></section><div id="seasons"><div class="empty">Loading seasons and episodes…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script>
const db=window.supabase.createClient('https://fmnrzdqkwrlieqxlixbc.supabase.co','sb_publishable_EzhZ4Y6pfIZw3Izfn7QmQw_O04zb4cb');
(async()=>{const name=new URLSearchParams(location.search).get('series');const host=document.getElementById('seasons');if(!name){host.innerHTML='<div class="empty">No anime series was selected.</div>';return}document.getElementById('seriesTitle').textContent=name;document.title=name+' | Pique Animes';const {data,error}=await db.from('media_items').select('id,title,description,season_number,episode_number').eq('media_type','anime').eq('published',true).ilike('title',name).order('season_number',{ascending:true}).order('episode_number',{ascending:true});if(error){host.innerHTML='<div class="empty">Could not load episodes right now.</div>';return}if(!data?.length){host.innerHTML='<div class="empty">No published episodes yet.</div>';return}host.innerHTML='';const seasons=new Map();data.forEach(item=>{const n=item.season_number||1;if(!seasons.has(n))seasons.set(n,[]);seasons.get(n).push(item)});[...seasons.entries()].sort((a,b)=>a[0]-b[0]).forEach(([n,episodes])=>{const section=document.createElement('section');section.className='season';const h=document.createElement('h2');h.textContent='Season '+n;const grid=document.createElement('div');grid.className='episodes';episodes.forEach(item=>{const a=document.createElement('a');a.className='episode';a.href='watch.html?id='+encodeURIComponent(item.id);const title=document.createElement('strong');title.textContent='Episode '+(item.episode_number||'?');const desc=document.createElement('small');desc.textContent=item.description||'Watch episode';a.append(title,desc);grid.append(a)});section.append(h,grid);host.append(section)})})();
</script></body></html>
