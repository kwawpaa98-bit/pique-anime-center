<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Watch | Pique Animes</title>
<style>:root{--bg:#08090d;--panel:#12151d;--line:#292e3b;--muted:#9ca3b2;--red:#e11d48;--gold:#e8c27a;--white:#f7f7fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#252b3c 0,transparent 42%),var(--bg);color:var(--white);font:15px Inter,system-ui,Arial,sans-serif}.wrap{width:min(1100px,92%);margin:35px auto}a{color:var(--gold);text-decoration:none}.brand{font-weight:900;letter-spacing:.04em}.brand span{color:var(--red)}.panel{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}video{width:100%;max-height:70vh;background:#000;border-radius:12px}h1{font-size:clamp(24px,4vw,38px)}p{color:var(--muted);line-height:1.6}.poster{width:90px;max-height:130px;object-fit:cover;float:right;border-radius:8px}</style></head><body><main class="wrap"><a class="brand" href="index.html">PIQUE <span>ANIMES</span></a><a style="float:right" href="anime.html">← Library</a><section class="panel"><img id="poster" class="poster" hidden><h1 id="title">Loading video…</h1><p id="description"></p><video id="player" controls playsinline preload="metadata"></video><p id="message">Loading title details…</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script>
const db=window.supabase.createClient('https://fmnrzdqkwrlieqxlixbc.supabase.co','sb_publishable_EzhZ4Y6pfIZw3Izfn7QmQw_O04zb4cb');
(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('message').textContent='No video was selected.';return}const {data,error}=await db.from('media_items').select('title,description,media_type,season_number,episode_number,poster_url,storage_path,mime_type').eq('id',id).eq('published',true).maybeSingle();if(error||!data){document.getElementById('message').textContent='This video is unavailable or has not been published.';return}document.title=data.title+' | Pique Animes';document.getElementById('title').textContent=data.title+(data.episode_number?' · S'+(data.season_number||1)+' E'+data.episode_number:'');document.getElementById('description').textContent=data.description||'';if(data.poster_url){const img=document.getElementById('poster');img.src=data.poster_url;img.hidden=false}const {data:{publicUrl}}=db.storage.from('pique-videos').getPublicUrl(data.storage_path);const player=document.getElementById('player');player.src=publicUrl;player.type=data.mime_type;document.getElementById('message').textContent='If playback does not start, your browser may not support this video format.'})();
</script></body></html>
