<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07152d"><title>PIQUE ARCADE</title><style>
*{box-sizing:border-box}body{margin:0;background:#07152d;color:#eff7ff;font:15px/1.5 Arial,sans-serif}.bar{height:62px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;background:#fff;color:#142743}.brand{font-weight:950}.brand b{color:#1769ff}.back{padding:8px 13px;border-radius:9px;background:#eaf2ff;color:#1769ff;font-weight:900}.wrap{width:min(1100px,94%);margin:20px auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:13px}.eyebrow{color:#55dfff;font-size:11px;font-weight:900;letter-spacing:2px}.head h1{margin:4px 0;font-size:clamp(25px,5vw,42px);line-height:1}.head p{margin:5px 0;color:#a8bdd8}.hud{display:flex;gap:8px}.pill{padding:8px 12px;border:1px solid #29466e;border-radius:10px;background:#102747;font-size:12px;font-weight:900}.pill b{color:#fff}.stage{position:relative;overflow:hidden;border:1px solid #28466f;border-radius:17px;background:#091b36;box-shadow:0 22px 60px #0008}.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:15px;background:#06142bdc;text-align:center}.panel{width:min(420px,95%);padding:24px;border:1px solid #5bd5ff66;border-radius:17px;background:#0b203df2}.symbol{font-size:40px}.panel h2{margin:4px 0;font-size:27px}.panel p{color:#b9cce5}.primary{border:0;border-radius:10px;padding:13px 23px;background:linear-gradient(100deg,#1769ff,#04bfe8);color:#fff;font-weight:950}.controls{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;gap:12px}.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,40px);gap:5px}.pad button,.action{border:1px solid #36557f;border-radius:10px;background:#102b50;color:#fff;font-weight:900;touch-action:none;user-select:none}.pad [data-k=up]{grid-column:2}.pad [data-k=left]{grid-column:1;grid-row:2}.pad [data-k=down]{grid-column:2;grid-row:2}.pad [data-k=right]{grid-column:3;grid-row:2}.action{min-width:94px;height:80px;background:linear-gradient(145deg,#1769ff,#05b9d8);font-size:12px}.help{text-align:center;color:#9db4d2;font-size:12px;margin:8px 0 20px}@media(max-width:600px){.wrap{margin:13px auto}.head{align-items:flex-start;flex-direction:column}.stage{border-radius:11px}.pad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,37px)}.action{height:76px}}
</style></head><body><header class="bar"><a class="brand" href="index.html">✦ PIQUE <b>GAMES CENTER</b></a><a class="back" href="games.html">← LIBRARY</a></header><main class="wrap"><div class="head"><div><span class="eyebrow">PIQUE ARCADE · GAME MODE</span><h1 id="title">Loading...</h1><p id="subtitle"></p></div><div class="hud"><div class="pill">SCORE <b id="score">0</b></div><div class="pill">BEST <b id="best">0</b></div><div class="pill">LIVES <b id="lives">3</b></div></div></div><div class="stage"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="panel"><div class="symbol" id="symbol">⚡</div><h2 id="panelTitle">Ready?</h2><p id="panelText"></p><button class="primary" id="start">START GAME</button></div></div></div><div class="controls"><div class="pad"><button data-k="up">▲</button><button data-k="left">◀</button><button data-k="down">▼</button><button data-k="right">▶</button></div><button class="action" id="act">ACTION<br>SPACE</button></div><p class="help">Keyboard: arrow keys or WASD to move · Space to jump, shoot or boost. Phone: use the touch buttons.</p></main>
<script>
(()=>{
const G={
"neon-drift":["Neon Drift","RACING · Dodge traffic and collect energy","🏎️","Steer around traffic and gather glowing energy."],
"apex-rally":["Apex Rally","RALLY · Survive the rough course","🏁","Keep your car on the track and avoid barriers."],
"street-velocity":["Street Velocity","HIGHWAY · Speed through traffic","🚘","Switch lanes, dodge roadblocks and grab boost orbs."],
"cyber-strike":["Cyber Strike","SHOOTING · Clear the drone wave","🎯","Move around and fire at enemy drones."],
"alien-siege":["Alien Siege","SPACE DEFENCE · Protect the outpost","👾","Defend your base from incoming alien ships."],
"tank-frontline":["Tank Frontline","TANK BATTLE · Survive the arena","🛡️","Move your tank and fire at enemy armour."],
"jungle-quest":["Jungle Quest","PLATFORM ADVENTURE · Find the relics","🌴","Jump across the ruins and collect the gems."],
"shadow-runner":["Shadow Runner","ENDLESS RUN · Keep moving","🌃","Run automatically and jump over obstacles."],
"crystal-caverns":["Crystal Caverns","CAVE EXPLORATION · Gather crystals","💎","Explore the cave, collect crystals and avoid creatures."],
"sky-escape":["Sky Escape","FLIGHT · Navigate the storm","🛩️","Guide your aircraft through the gaps and collect stars."]
};
const id=new URLSearchParams(location.search).get("game")||"neon-drift",m=G[id]||G["neon-drift"],c=document.querySelector("#game"),x=c.getContext("2d"),W=960,H=540;
const $=s=>document.querySelector(s);$("#title").textContent=m[0];$("#subtitle").textContent=m[1];$("#symbol").textContent=m[2];$("#panelText").textContent=m[3];document.title=m[0]+" | PIQUE ARCADE";
let keys={},p={},things=[],sparks=[],score=0,lives=3,best=+(localStorage.getItem("pgc-best-"+id)||0),tick=0,spawn=0,road=0,run=false,raf=0;
$("#best").textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){score=0;lives=3;tick=spawn=road=0;things=[];sparks=[];p={x:480,y:420,vx:0,vy:0,w:38,h:48,ground:false,inv:0,face:-1.57,boost:0};hud()}
function hud(){$("#score").textContent=Math.floor(score);$("#lives").textContent=lives}
function burst(a,b,col,n=12){for(let i=0;i<n;i++)sparks.push({x:a,y:b,vx:rand(-4,4),vy:rand(-4,4),life:rand(15,35),col})}
function finish(){run=false;cancelAnimationFrame(raf);best=Math.max(best,Math.floor(score));localStorage.setItem("pgc-best-"+id,best);$("#best").textContent=best;$("#panelTitle").textContent=lives?"CHALLENGE COMPLETE":"GAME OVER";$("#panelText").textContent="You scored "+Math.floor(score)+" points. Best: "+best;$("#start").textContent="PLAY AGAIN";$("#overlay").style.display="grid"}
function begin(){reset();$("#overlay").style.display="none";$("#start").textContent="START GAME";run=true;loop()}
$("#start").onclick=begin;
function act(){if(!run)return;if(["cyber-strike","alien-siege","tank-frontline"].includes(id)){things.push({t:"bullet",x:p.x,y:p.y,vx:Math.cos(p.face)*10,vy:Math.sin(p.face)*10,r:6,life:80})}else if(["jungle-quest","shadow-runner"].includes(id)){if(p.ground||id==="shadow-runner"){p.vy=-14;p.ground=false}}else if(id==="neon-drift"||id==="street-velocity"||id==="apex-rally")p.boost=50}
$("#act").onpointerdown=e=>{e.preventDefault();act()};
function spawnThing(){if(["neon-drift","apex-rally","street-velocity"].includes(id))things.push({t:Math.random()<.24?"gem":"block",x:rand(250,710),y:-60,w:rand(34,60),h:rand(42,68),s:rand(4,7)+tick/1500});
else if(["cyber-strike","alien-siege","tank-frontline"].includes(id))things.push({t:"enemy",x:rand(50,910),y:-30,r:id==="tank-frontline"?24:19,s:rand(1.5,3)+tick/3500,hp:id==="tank-frontline"?2:1});
else if(["jungle-quest","shadow-runner"].includes(id))things.push({t:Math.random()<.3?"gem":"block",x:rand(45,910),y:-45,w:rand(30,50),h:rand(30,58),s:id==="shadow-runner"?7:4});
else if(id==="crystal-caverns")things.push({t:Math.random()<.58?"gem":"enemy",x:rand(35,925),y:rand(40,500),r:rand(13,20),vx:rand(-2,2),vy:rand(-2,2)});
else things.push({t:Math.random()<.22?"gem":"block",x:rand(50,910),y:-50,w:rand(48,90),h:rand(35,58),s:rand(3,6)})}
function hurt(){if(p.inv>0)return;lives--;p.inv=85;burst(p.x,p.y,"#ff5a83",18);hud();if(lives<=0)finish()}
function update(){tick++;let L=keys.left||keys.ArrowLeft||keys.a||keys.A,R=keys.right||keys.ArrowRight||keys.d||keys.D,U=keys.up||keys.ArrowUp||keys.w||keys.W,D=keys.down||keys.ArrowDown||keys.s||keys.S;
if(["neon-drift","apex-rally","street-velocity"].includes(id)){p.x=clamp(p.x+(R-L)*(p.boost?9:6),180,780);road+=p.boost?17:10;if(p.boost)p.boost--;if(tick-spawn>43){spawnThing();spawn=tick}things.forEach(o=>o.y+=o.s*(p.boost?1.6:1))}
else if(["cyber-strike","alien-siege","tank-frontline"].includes(id)){p.x=clamp(p.x+(R-L)*(id==="tank-frontline"?4:6),25,935);p.y=clamp(p.y+(D-U)*(id==="tank-frontline"?4:6),75,510);if(L)p.face=Math.PI;if(R)p.face=0;if(U)p.face=-1.57;if(D)p.face=1.57;if(tick-spawn>(id==="tank-frontline"?78:52)){spawnThing();spawn=tick}things.forEach(o=>{if(o.t==="enemy"){o.y+=o.s;o.x+=id==="tank-frontline"?Math.sin(tick/20)*1.2:0}else{o.x+=o.vx;o.y+=o.vy;o.life--}});if(id!=="tank-frontline"&&tick%18===0)act()}
else if(["jungle-quest","shadow-runner"].includes(id)){if(id==="shadow-runner")p.x=Math.min(365,p.x+2.1);else p.x=clamp(p.x+(R-L)*5,25,935);p.vy+=.65;p.y+=p.vy;if(p.y>475){p.y=475;p.vy=0;p.ground=true}if(U&&!p.wasUp&&(p.ground||id==="shadow-runner")){p.vy=-14;p.ground=false}p.wasUp=U;if(tick-spawn>(id==="shadow-runner"?48:66)){spawnThing();spawn=tick}things.forEach(o=>o.y+=o.s)}
else if(id==="crystal-caverns"){p.x=clamp(p.x+(R-L)*5,25,935);p.y=clamp(p.y+(D-U)*5,25,515);if(tick-spawn>72){spawnThing();spawn=tick}things.forEach(o=>{o.x+=o.vx||0;o.y+=o.vy||0;if(o.x<20||o.x>940)o.vx*=-1;if(o.y<20||o.y>520)o.vy*=-1})}
else{p.x=clamp(p.x+(R-L)*5,35,925);p.y=clamp(p.y+(D-U)*5,35,505);if(tick-spawn>45){spawnThing();spawn=tick}things.forEach(o=>o.y+=o.s)}
if(p.inv>0)p.inv--;
things.forEach(o=>{if(o.t==="bullet"){things.forEach(t=>{if(t.t==="enemy"&&Math.hypot(o.x-t.x,o.y-t.y)<o.r+t.r){t.hp--;o.life=0;if(t.hp<=0){t.dead=true;score+=20;burst(t.x,t.y,"#ffbd59")}}})}else if(o.t==="gem"&&Math.hypot(p.x-o.x,p.y-o.y)<34){o.dead=true;score+=25;burst(o.x,o.y,"#55f3ff")}else if(o.t==="block"&&Math.abs(p.x-o.x)<(o.w+p.w)*.43&&Math.abs(p.y-o.y)<(o.h+p.h)*.4){o.dead=true;hurt()}else if(o.t==="enemy"&&Math.hypot(p.x-o.x,p.y-o.y)<o.r+20&&!["cyber-strike","alien-siege","tank-frontline"].includes(id)){o.dead=true;hurt()}});
things=things.filter(o=>!o.dead&&o.life!==0&&o.y<H+100&&o.x>-100&&o.x<W+100);sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.life--});sparks=sparks.filter(s=>s.life>0);score+=.1;hud()}
function background(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#153968");g.addColorStop(1,"#071326");x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<65;i++){x.fillStyle="#b9edff66";x.fillRect((i*137+tick*.3)%W,(i*83+tick*.6)%H,2,2)}}
function scenery(){if(["neon-drift","apex-rally","street-velocity"].includes(id)){x.fillStyle="#121e38";x.beginPath();x.moveTo(190,0);x.lineTo(770,0);x.lineTo(930,H);x.lineTo(30,H);x.fill();x.strokeStyle="#32dfff";x.lineWidth=5;x.beginPath();x.moveTo(190,0);x.lineTo(30,H);x.moveTo(770,0);x.lineTo(930,H);x.stroke();x.strokeStyle="#d9f4ff99";x.lineWidth=3;for(let i=0;i<10;i++){let y=(i*82+road)%H;x.beginPath();x.moveTo(390,y);x.lineTo(390,y+35);x.moveTo(570,y);x.lineTo(570,y+35);x.stroke()}}
else if(["jungle-quest","shadow-runner"].includes(id)){x.fillStyle="#174d45";for(let i=0;i<10;i++){x.beginPath();x.arc((i*130-tick*.5%W+W)%W,80+(i%3)*40,45,0,7);x.fill()}x.fillStyle="#80613f";x.fillRect(0,505,W,35);x.fillStyle="#56d59c";x.fillRect(0,500,W,6)}
else if(id==="crystal-caverns"){x.fillStyle="#142d51";for(let i=0;i<14;i++){let xx=i*75;x.beginPath();x.moveTo(xx,0);x.lineTo(xx+28,65);x.lineTo(xx+54,0);x.fill();x.beginPath();x.moveTo(xx,H);x.lineTo(xx+24,H-65);x.lineTo(xx+50,H);x.fill()}}
else if(id==="sky-escape"){x.fillStyle="#b7efff25";for(let i=0;i<6;i++){x.beginPath();x.ellipse((i*190-tick%W+W)%W,100+i%3*110,70,18,0,0,7);x.fill()}}}
function drawPlayer(){x.save();x.translate(p.x,p.y);if(p.inv%10>5)x.globalAlpha=.35;
if(["neon-drift","apex-rally","street-velocity"].includes(id)){x.shadowColor="#23dfff";x.shadowBlur=22;x.fillStyle="#20caff";x.beginPath();x.roundRect(-19,-30,38,60,9);x.fill();x.fillStyle="#e6fcff";x.fillRect(-12,-18,24,15);x.fillStyle="#10223c";x.fillRect(-15,19,9,10);x.fillRect(6,19,9,10)}
else if(["cyber-strike","alien-siege","tank-frontline"].includes(id)){x.rotate(p.face);x.shadowColor="#38eaff";x.shadowBlur=18;x.fillStyle=id==="tank-frontline"?"#81c58c":"#42e7ff";x.beginPath();x.arc(0,0,id==="tank-frontline"?24:19,0,7);x.fill();x.fillStyle="#fff";x.fillRect(-5,-30,10,30);x.fillStyle="#15334e";x.beginPath();x.arc(0,0,8,0,7);x.fill()}
else if(id==="sky-escape"){x.rotate(-.15);x.fillStyle="#ffbf56";x.shadowColor="#ffbd56";x.shadowBlur=20;x.beginPath();x.moveTo(0,-30);x.lineTo(13,13);x.lineTo(40,25);x.lineTo(40,33);x.lineTo(0,24);x.lineTo(-40,33);x.lineTo(-40,25);x.lineTo(-13,13);x.closePath();x.fill()}
else{x.fillStyle="#7dffbf";x.shadowColor="#6dffbe";x.shadowBlur=18;x.beginPath();x.roundRect(-16,-24,32,48,9);x.fill();x.fillStyle="#153a52";x.fillRect(-9,-12,18,9)}x.restore()}
function drawThing(o){x.save();x.translate(o.x,o.y);if(o.t==="gem"){x.shadowColor="#4cf5ff";x.shadowBlur=20;x.fillStyle="#5af5ff";x.beginPath();x.moveTo(0,-15);x.lineTo(13,0);x.lineTo(0,15);x.lineTo(-13,0);x.fill()}else if(o.t==="block"){x.shadowColor="#ff557c";x.shadowBlur=13;x.fillStyle="#ff5276";x.beginPath();x.roundRect(-o.w/2,-o.h/2,o.w,o.h,8);x.fill();x.fillStyle="#ffd5df";x.fillRect(-o.w*.3,-o.h*.3,o.w*.6,5)}else if(o.t==="enemy"){x.shadowColor="#ff5276";x.shadowBlur=17;x.fillStyle="#ff557c";x.beginPath();x.arc(0,0,o.r,0,7);x.fill();x.fillStyle="#291531";x.fillRect(-o.r*.55,-4,o.r*1.1,8);x.fillStyle="#fff";x.fillRect(-o.r*.3,-2,5,4);x.fillRect(o.r*.1,-2,5,4)}else{x.fillStyle="#fff18a";x.shadowColor="#fff18a";x.shadowBlur=16;x.beginPath();x.arc(0,0,o.r,0,7);x.fill()}x.restore()}
function draw(){background();scenery();things.forEach(drawThing);sparks.forEach(s=>{x.globalAlpha=s.life/35;x.fillStyle=s.col;x.fillRect(s.x,s.y,4,4)});x.globalAlpha=1;drawPlayer();x.fillStyle="#ffffffaa";x.font="bold 15px Arial";x.fillText(m[0].toUpperCase(),24,30);x.fillStyle="#64eaff";x.fillRect(24,42,Math.min(230,score/2),4)}
function loop(){if(!run)return;update();draw();raf=requestAnimationFrame(loop)}
addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===" "&&!e.repeat)act()});addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k==="up"?"ArrowUp":b.dataset.k==="down"?"ArrowDown":b.dataset.k==="left"?"ArrowLeft":"ArrowRight";b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};["pointerup","pointercancel","lostpointercapture"].forEach(v=>b.addEventListener(v,()=>keys[k]=false))});
background();draw();
})();
</script></body></html>
